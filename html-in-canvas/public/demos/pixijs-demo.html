<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixiJS HTML-in-Canvas Demo</title>
  <link rel="stylesheet" href="../css/theme.css">
  <!-- Load PixiJS and the HTML-in-Canvas package as global UMD scripts -->
  <script src="https://unpkg.com/pixi.js@8.19.0/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/pixi.js@8.19.0/dist/packages/html-source.js"></script>

  <!-- Import map wrapping UMD globals as ES Modules using data URIs -->
  <script type="importmap">
    {
      "imports": {
        "pixi.js": "data:text/javascript,const { Application, Sprite, Texture } = window.PIXI; export { Application, Sprite, Texture };",
        "pixi.js/html-source": "data:text/javascript,export const HTMLSource = window.PIXI.HTMLSource;"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #pixi-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* The HTML element that will be rendered as a texture inside the PixiJS canvas */
    #html-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 450px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #ff007f;
      box-shadow: 0 0 0 4px rgba(255, 0, 127, 0.15);
    }

    button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 0, 127, 0.25);
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 0, 127, 0.35);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(255, 0, 127, 0.2);
    }

    /* Warning Banner if browser doesn't support the API */
    #api-warning {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 75, 75, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(255, 75, 75, 0.3);
      backdrop-filter: blur(10px);
      z-index: 1000;
      text-align: center;
      max-width: 90%;
      display: none;
    }

    #api-warning h2 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
    }

    #api-warning p {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>

<body>

  <div id="api-warning">
    <h2>HTML-in-Canvas Not Supported</h2>
    <p>This demo requires a browser with HTML-in-Canvas support (e.g. Chrome 150+ with the "Experimental Web Platform
      Features" flag enabled).</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- WebGL 2 Compatibility Patch for Chromium 150+ HTML-in-Canvas ---
    // PixiJS HTMLSource (as of v8.19.0) still uses the legacy 6-argument texElementImage2D signature.
    // Chromium 150+ strictly implements the finalized 3-argument signature.
    // This prototype patch intercepts legacy 6-argument calls on the fly and rewrites them.
    (function () {
      const gl = WebGL2RenderingContext.prototype;
      if (!gl || (!gl.texElementImage2D && !gl.texElementSubImage2D)) return;

      const originalTexElementImage2D = gl.texElementImage2D;
      const originalTexElementSubImage2D = gl.texElementSubImage2D;
      gl.texElementImage2D = function (target, ...args) {
        const source = args[args.length - 1];
        if (this.canvas) {
          if (!this.canvas.hasAttribute('content')) this.canvas.setAttribute('content', 'drawable');
          if (!this.canvas.hasAttribute('layoutsubtree')) this.canvas.setAttribute('layoutsubtree', '');
          if (!this.canvas._hicPaintInit) {
            this.canvas._hicPaintInit = true;
            this.canvas.addEventListener('paint', () => {});
          }
          this.canvas.requestPaint?.();
        }
        if (source instanceof Element && !source.hasAttribute('drawable')) {
          source.setAttribute('drawable', '');
        }
        const internalFormat = args.length > 2 ? args[1] : args[0];
        const sizedFormat = internalFormat === this.RGBA ? (this.RGBA8 || this.RGBA) : (internalFormat || this.RGBA8 || this.RGBA);
        const boundTex = this.getParameter(this.TEXTURE_BINDING_2D);
        const flipY = this.getParameter(this.UNPACK_FLIP_Y_WEBGL);
        const dpr = window.devicePixelRatio || 1;
        let width = Math.max(1, Math.round((source?.offsetWidth || 450) * dpr));
        let height = Math.max(1, Math.round((source?.offsetHeight || 320) * dpr));

        if (typeof originalTexElementSubImage2D === 'function') {
          let hasPaintRecord = false;
          if (typeof this.canvas?.captureElementImage === 'function') {
            try {
              const elemImage = this.canvas.captureElementImage(source);
              if (elemImage?.width && elemImage?.height) {
                width = Math.ceil(elemImage.width);
                height = Math.ceil(elemImage.height);
                hasPaintRecord = true;
              }
            } catch (e) {
              hasPaintRecord = false;
            }
          }
          if (!boundTex || boundTex._hicW !== width || boundTex._hicH !== height) {
            this.texImage2D(target, 0, sizedFormat, width, height, 0, this.RGBA, this.UNSIGNED_BYTE, null);
            if (boundTex) {
              boundTex._hicW = width;
              boundTex._hicH = height;
            }
          }
          if (hasPaintRecord || typeof this.canvas?.captureElementImage !== 'function') {
            try {
              return originalTexElementSubImage2D.call(this, target, 0, 0, 0, source);
            } catch (e) {}
          }
          if (this.canvas && boundTex && !boundTex._hicPending) {
            boundTex._hicPending = true;
            this.canvas.addEventListener('paint', () => {
              boundTex._hicPending = false;
              const prevTex = this.getParameter(this.TEXTURE_BINDING_2D);
              const prevFlip = this.getParameter(this.UNPACK_FLIP_Y_WEBGL);
              this.bindTexture(target, boundTex);
              this.pixelStorei(this.UNPACK_FLIP_Y_WEBGL, flipY);
              this.texElementImage2D(target, sizedFormat, source);
              this.pixelStorei(this.UNPACK_FLIP_Y_WEBGL, prevFlip);
              this.bindTexture(target, prevTex);
            }, { once: true });
            this.canvas.requestPaint?.();
          }
          return;
        } else if (originalTexElementImage2D.length === 3) {
          try {
            return originalTexElementImage2D.call(this, target, sizedFormat, source);
          } catch (e) {}
        }
        try {
          return originalTexElementImage2D.apply(this, [target, ...args]);
        } catch (e) {}
      };
    })();
    // ---------------------------------------------------------------------

  </script>

  <script type="module">
    import { Application, Sprite } from 'pixi.js';
    import { HTMLSource } from 'pixi.js/html-source';

    async function initDemo() {
      // 1. Check for browser HTML-in-Canvas support
      if (!('requestPaint' in HTMLCanvasElement.prototype)) {
        document.getElementById('api-warning').style.display = 'block';
      }

      // 2. Initialize PixiJS Application
      const app = new Application();
      await app.init({
        resizeTo: window,
        antialias: true,
        backgroundAlpha: 0, // Keep transparent to see background gradient
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
        hello: true
      });

      app.canvas.setAttribute('content', 'drawable');
      app.canvas.setAttribute('layoutsubtree', '');

      const container = document.getElementById('canvas-container');
      container.appendChild(app.canvas);

      // 3. Create the HTML element dynamically and append to the Pixi canvas (must be a direct child)
      const form = document.createElement('form');
      form.id = 'html-card';
      form.setAttribute('drawable', '');
      form.onsubmit = (event) => event.preventDefault();
      form.innerHTML = `
        <h1>PixiJS + HTML-in-Canvas</h1>
        <p>This card is a real, interactive HTML element rendered on the GPU inside PixiJS! Try typing or clicking the
          button below.</p>
        <input type="text" placeholder="Type something here..." id="card-input">
        <button type="button" id="card-btn">Trigger Alert!</button>
      `;
      app.canvas.appendChild(form);

      // 4. Set up the interactive alert
      const btn = form.querySelector('#card-btn');
      const input = form.querySelector('#card-input');

      btn.addEventListener('click', () => {
        const val = input.value.trim();
        alert(val ? `You typed: "${val}"` : "Hello from the interactive PixiJS HTML texture!");
      });

      // 5. Create the HTMLSource texture/sprite
      const sprite = Sprite.from(new HTMLSource({ resource: form, autoUpdate: true }));

      // 6. Center the sprite and add it to the stage
      sprite.anchor.set(0.5);
      sprite.x = app.screen.width / 2;
      sprite.y = app.screen.height / 2;

      app.stage.addChild(sprite);

      // 7. Add a rotation and scale animation and sync the DOM transform for HTML-in-Canvas interaction
      app.ticker.add((ticker) => {
        // Slow continuous rotation
        sprite.rotation += 0.003 * ticker.deltaTime;

        // Gentle heartbeat scale effect
        const scale = 1 + Math.sin(ticker.lastTime * 0.0015) * 0.06;
        sprite.scale.set(scale);

        // Sync DOM transform using updateElementGeometry / getElementTransform for interactive inputs
        if (app.canvas.updateElementGeometry || app.canvas.getElementTransform) {
          const width = form.offsetWidth;
          const height = form.offsetHeight;

          // Translate the top-left element coordinates to match the sprite's centered anchor (0.5)
          const anchorTranslation = new DOMMatrix().translate(-width / 2, -height / 2);

          // Get the sprite's world transform matrix and scale by DPR to match physical canvas coordinates
          const dpr = window.devicePixelRatio || 1;
          const wt = sprite.worldTransform;
          const wtMatrix = new DOMMatrix([
            wt.a * dpr,
            wt.b * dpr,
            wt.c * dpr,
            wt.d * dpr,
            wt.tx * dpr,
            wt.ty * dpr
          ]);

          // Combine matrices
          const finalTransform = wtMatrix.multiply(anchorTranslation);

          // Scale by 1/dpr to prevent double-scaling on high-DPI screens
          finalTransform.scaleSelf(1 / dpr, 1 / dpr, 1);

          // Position element at top-left of canvas with 0 0 transform-origin for getElementTransform mapping
          form.style.position = 'absolute';
          form.style.left = '0';
          form.style.top = '0';
          form.style.transformOrigin = '0 0';

          if (typeof app.canvas.updateElementGeometry === 'function') {
            // Chrome 155+: `canvasTransform` maps the element's border box to the
            // canvas in CSS pixels and is used as-is. Unlike the legacy
            // `getElementTransform()` below, the browser does not convert it from
            // canvas grid pixels. `finalTransform` is in canvas grid (device)
            // pixels, so change basis: T_css = S_gridToCss * T_grid * S_gridToCss^-1
            // (dprX/dprY are the same grid-to-CSS ratios the legacy API uses).
            const dprX = app.canvas.width / app.canvas.clientWidth;
            const dprY = app.canvas.height / app.canvas.clientHeight;
            const canvasTransform = new DOMMatrix()
              .scale(1 / dprX, 1 / dprY)
              .multiply(finalTransform)
              .scale(dprX, dprY);
            app.canvas.updateElementGeometry(form, { canvasTransform });
          } else if (typeof app.canvas.getElementTransform === 'function') {
            let syncT = app.canvas.getElementTransform(form, finalTransform);
            if (syncT) {
              form.style.transform = syncT.toString();
            }
          }
        }
      });

      // Handle window resizing to keep the sprite centered
      window.addEventListener('resize', () => {
        sprite.x = app.screen.width / 2;
        sprite.y = app.screen.height / 2;
      });
    }

    // Start the initialization
    initDemo().catch(console.error);
  </script>

</body>

</html>
